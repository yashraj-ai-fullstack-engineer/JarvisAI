[project]
name = "nexa-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "python-dotenv",
  "pillow",
  "requests",
  "beautifulsoup4",
  "pypdf",
  "fastapi",
  "python-multipart",
  "uvicorn[standard]",
  "langgraph>=1.0,<2",
  "langchain-openai>=1.0,<2",
  "langchain-mcp-adapters>=0.3,<0.4",
  "langsmith>=0.10,<1",
  "mcp>=1.24,<2",
  "cryptography>=44,<46",
  "pymongo[srv]>=4.10,<5",
  "holidays>=0.80,<1",
]

[tool.vercel]
entrypoint = "index:app"
